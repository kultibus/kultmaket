<!-- modal-feedback.html -->
<div class="modal" id="modal-feedback">
    <div class="modal__overlay" data-lp-fixed>
        <div
            class="modal__container"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modal-title"
            data-modal-container
        >
            <button
                class="modal__close"
                type="button"
                data-target-close="#modal-feedback"
                aria-label="Закрыть модальное окно"
            >
                <span class="icon icon--lg" aria-hidden="true">
                    <svg width="24" height="24" focusable="false">
                        <use href="img/sprite.svg#cross-small"></use>
                    </svg>
                </span>
            </button>

            <div class="modal__content">
                <h2 class="modal__title" id="modal-title">
                    Готовы обсудить ваш проект?
                </h2>
                <p class="modal__subtitle">
                    Оставьте заявку, и ваш персональный менеджер свяжется с вами
                    для бесплатной консультации и расчёта стоимости.
                </p>

                <form class="contact-form" id="modal-contact-form">
                    <div class="form-group">
                        <input
                            type="text"
                            name="name"
                            placeholder="Имя"
                            required
                            data-validation="name"
                            class="form-input"
                            data-target-to-disable
                        />
                        <div class="form-error" data-error="name"></div>
                    </div>

                    <div class="form-group">
                        <input
                            type="tel"
                            name="phone"
                            placeholder="Телефон"
                            required
                            data-validation="phone"
                            class="form-input"
                            data-target-to-disable
                        />
                        <div class="form-error" data-error="phone"></div>
                    </div>

                    <div class="form-agreement">
                        <label class="checkbox">
                            <input
                                type="checkbox"
                                name="agreement"
                                required
                                data-target-to-disable
                            />
                            <span class="checkbox__checkmark"></span>
                            <span class="checkbox__text">
                                Нажимая кнопку, вы соглашаетесь с
                                <a href="/privacy.html"
                                    >политикой конфиденциальности</a
                                >
                            </span>
                        </label>
                        <div class="form-error" data-error="agreement"></div>
                    </div>

                    <button
                        type="submit"
                        class="btn btn--primary btn--block"
                        data-analytics="modal-form-submit"
                        id="modal-submit-btn"
                        data-target-to-disable
                    >
                        Отправить запрос
                    </button>

                    <div class="form-message"></div>
                </form>

                <!-- Окно успешной отправки -->
                <div class="modal__success" id="modal-success">
                    <div class="success-message">
                        <span
                            class="success-icon icon icon--xl"
                            aria-hidden="true"
                        >
                            <svg width="64" height="64" focusable="false">
                                <use
                                    href="img/sprite.svg#memo-circle-check"
                                ></use>
                            </svg>
                        </span>
                        <h3 class="success-title">Запрос отправлен!</h3>
                        <p class="success-text">
                            Ваш персональный менеджер свяжется с вами в течение
                            15 минут для бесплатной консультации и расчёта
                            стоимости.
                        </p>
                        <button
                            class="btn btn--primary"
                            data-target-close="#modal-feedback"
                        >
                            Понятно
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
